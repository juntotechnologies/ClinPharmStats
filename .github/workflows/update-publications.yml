name: Update Publications

# Each day: update the citation counts in app/scholarship/page.tsx from PubMed.
# Commit a change to the branch that ran, then start the deploy workflow for that branch.
# Google Scholar blocks GitHub runners ("Cannot Fetch from Google Scholar"), so the Scholar
# script does not run here. Run `.github/scripts/update_publications.py` on a local machine.
# A push with the default token starts no workflow, so the explicit start is needed.
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-publications:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile the scripts
        run: python -m py_compile .github/scripts/update_publications.py .github/scripts/update_vijay_citations.py

      - name: Update the citation counts from PubMed
        run: python .github/scripts/update_vijay_citations.py

      - name: Commit and push a change, then start the deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add app/scholarship/page.tsx
          git diff --staged --quiet && echo "No change." && exit 0
          git -c user.name='GitHub Actions Bot' -c user.email='actions@github.com' commit -m "Update: Publications from Google Scholar and PubMed"
          git push
          gh workflow run github-pages-deploy.yml --ref "$GITHUB_REF_NAME"
