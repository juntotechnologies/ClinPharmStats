name: Deploy to GitHub Pages

# A pull request runs the checks only. Only a push to main, or a by-hand run on main, deploys.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint and test
        run: |
          npm run lint
          npm test

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Keep the built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          include-hidden-files: true  # out/.well-known holds the agent rules
          retention-days: 1

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      - name: Configure for GitHub Pages
        run: |
          touch out/.nojekyll
          echo "clinpharmstats.com" > out/CNAME

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out # The folder the action should deploy
          clean: true # Automatically remove deleted files from the deployment
